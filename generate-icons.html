<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор иконок — Java Roadmap</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 32px 20px; background: #f3f2f0; color: #0e0e0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(720px, 100%); margin: 0 auto; }
    h1 { letter-spacing: -.03em; font-family: Georgia, "Times New Roman", serif; }
    p { color: #444448; line-height: 1.6; }
    .previews { display: flex; flex-wrap: wrap; gap: 22px; align-items: end; margin: 28px 0; }
    .preview { display: grid; gap: 10px; justify-items: center; }
    .preview img { display: block; max-width: 100%; height: auto; border-radius: 22%; box-shadow: 0 12px 28px rgba(0, 0, 0, .24); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex; align-items: center; min-height: 46px; padding: 10px 18px;
      border-radius: 12px; background: #d81f1f; color: #fff; font-weight: 700;
      text-decoration: none;
    }
    code { background: #e8e6e3; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Иконки PWA</h1>
    <p>Страница рисует иконки на canvas и сразу предлагает скачать PNG. После замены файлов увеличьте версию кэша в <code>sw.js</code>.</p>
    <div class="previews" id="previews"></div>
    <div class="actions" id="actions"></div>
  </main>
  <script>
    "use strict";
    const sizes = [192, 512];
    const previews = document.getElementById("previews");
    const actions = document.getElementById("actions");

    function drawIcon(size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, size, size);

      const inset = size * 0.125;
      const radius = size * 0.185;
      ctx.fillStyle = "#d81f1f";
      ctx.beginPath();
      ctx.roundRect(inset, inset, size - inset * 2, size - inset * 2, radius);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 " + Math.round(size * 0.42) + "px Georgia, 'Times New Roman', serif";
      ctx.fillText("J", size / 2, size * 0.49);

      ctx.fillRect(size / 2 - size * 0.068, size * 0.73, size * 0.136, size * 0.012);
      return canvas;
    }

    sizes.forEach((size) => {
      const canvas = drawIcon(size);
      const url = canvas.toDataURL("image/png");
      const preview = document.createElement("div");
      preview.className = "preview";
      preview.innerHTML = '<img src="' + url + '" width="' + size + '" height="' + size + '" alt="Иконка ' + size + ' px">' +
        '<span>icon-' + size + '.png</span>';
      previews.appendChild(preview);

      const link = document.createElement("a");
      link.href = url;
      link.download = "icon-" + size + ".png";
      link.textContent = "Скачать " + size + " px";
      actions.appendChild(link);
    });
  </script>
</body>
</html>
